<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiger Trade Follow-up</title>
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TT Follow-up">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --navy:#1F3864; --blue:#2E75B6; --blue-2:#5EA8E8;
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#16213A; --ink-2:#56627A; --ink-3:#8A94A8;
  --line:#E3E8F0; --chip:#EEF2F8;
  --red:#D64545; --red-bg:#FDECEC; --amber:#C98A0B; --amber-bg:#FDF4E1;
  --green:#1E9A62; --green-bg:#E5F6EE; --violet:#6B5BD2; --violet-bg:#EFEDFC;
  --new:#FFF7DB; --shadow:0 1px 2px rgba(22,33,58,.06),0 4px 14px rgba(22,33,58,.06);
  --hdr:#1F3864; --hdr-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1424; --card:#172036; --ink:#E8EDF7; --ink-2:#A9B4CA; --ink-3:#7A869E;
    --line:#26314B; --chip:#212C45; --red-bg:#3A1E24; --amber-bg:#3A2F17; --green-bg:#16352A;
    --violet-bg:#272552; --new:#2D2A16; --shadow:none; --hdr:#141C30;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
h1,h2,h3,.num{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
a{color:var(--blue)}

/* ── shell: internal scroll so fixed overlays work everywhere ── */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{background:var(--hdr);color:var(--hdr-ink);padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;
  display:flex;align-items:center;gap:10px;flex-shrink:0}
header h1{font-size:18px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;opacity:.7;font-weight:500}
.hbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);flex-shrink:0}
.hbtn svg{width:20px;height:20px}
.spin svg{animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 84px}
nav.bottom{display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);flex-shrink:0}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;
  color:var(--ink-3);font-weight:600;padding:6px 0;position:relative}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--blue)}
.dot-badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;
  background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}

/* ── tabs inside a project ── */
.tabs{display:flex;gap:6px;background:var(--hdr);padding:0 12px 12px;flex-shrink:0;overflow-x:auto}
.tabs button{color:rgba(255,255,255,.7);font-weight:600;font-size:13.5px;padding:7px 13px;border-radius:999px;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--navy)}
.tabs .cnt{background:var(--red);color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px;margin-left:4px}

/* ── cards & bits ── */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sec{font:700 12px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  margin:20px 2px 10px;display:flex;align-items:center;gap:8px}
.sec:first-child{margin-top:4px}
.sec .n{background:var(--chip);color:var(--ink-2);border-radius:8px;padding:3px 7px;letter-spacing:0}
.sec.red{color:var(--red)} .sec.red .n{background:var(--red-bg);color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;
  border-radius:8px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.chip.red{background:var(--red-bg);color:var(--red)} .chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.green{background:var(--green-bg);color:var(--green)} .chip.violet{background:var(--violet-bg);color:var(--violet)}
.chip.blue{background:rgba(46,117,182,.12);color:var(--blue)}
.muted{color:var(--ink-3)} .small{font-size:12.5px}
.empty{text-align:center;color:var(--ink-3);padding:28px 10px;font-size:14px}
.empty b{display:block;font:700 16px system-ui,sans-serif;color:var(--ink-2);margin-bottom:4px}

/* project card */
.pcard{padding:16px;display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-bottom:12px}
.pcard h3{font-size:16.5px;font-weight:800;margin-bottom:2px}
.pcard .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.ring{position:relative;flex-shrink:0}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font:800 15px system-ui,sans-serif}
.ring .lbl small{display:block;font:600 9.5px system-ui,sans-serif;color:var(--ink-3);text-align:center;margin-top:-3px}

/* task row */
.task{display:flex;gap:11px;padding:13px 14px;width:100%;text-align:left;align-items:flex-start}
.task + .task{border-top:1px solid var(--line)}
.sdot{width:11px;height:11px;border-radius:50%;margin-top:5px;flex-shrink:0;border:2.5px solid var(--ink-3)}
.sdot.ip{border-color:var(--blue);background:var(--blue)} .sdot.bl{border-color:var(--red);background:var(--red)}
.sdot.dn{border-color:var(--green);background:var(--green)}
.task .t{font-weight:600;font-size:14.5px;line-height:1.35}
.task .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.task.done .t{color:var(--ink-3);text-decoration:line-through}
.group{overflow:hidden;margin-bottom:12px}
.ghead{padding:10px 14px;font:700 13px system-ui,sans-serif;color:var(--ink-2);background:var(--chip);display:flex;justify-content:space-between}

/* segmented */
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.stat .num{font-size:22px;font-weight:800}
.stat .l{font-size:11.5px;color:var(--ink-3);font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.phase{padding:13px 14px}
.phase + .phase{border-top:1px solid var(--line)}
.phase .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px;font-weight:600;font-size:14px}

/* activity */
.act{display:flex;gap:11px;padding:12px 14px;width:100%;text-align:left}
.act + .act{border-top:1px solid var(--line)}
.act.new{background:var(--new)}
.aic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex-shrink:0;background:var(--chip)}
.act .t{font-weight:600;font-size:14px}
.act .d{font-size:13px;color:var(--ink-2);margin-top:2px;word-break:break-word}
.act .w{font-size:11.5px;color:var(--ink-3);margin-top:4px}

/* forms */
.field{display:block;width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px}
.field:focus{outline:none;border-color:var(--blue)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:13px;
  background:var(--blue);color:#fff;font-weight:700;font-size:15.5px;text-decoration:none}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5}
.welcome{max-width:420px;margin:0 auto;padding-top:20px}
.welcome .logo{width:76px;height:76px;border-radius:20px;margin:0 auto 18px;display:block}
.welcome h2{text-align:center;font-size:22px;margin-bottom:6px}
.welcome p{text-align:center;color:var(--ink-2);margin:0 0 22px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.names button{padding:13px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600}
.names button.on{border-color:var(--blue);background:rgba(46,117,182,.1);color:var(--blue)}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px;gap:10px}
.row + .row{border-top:1px solid var(--line)}
.search{position:relative;margin-bottom:10px}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chips-scroll button{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.chips-scroll button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;background:var(--bg);border-radius:20px 20px 0 0;
  z-index:21;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex-shrink:0}
.sheet .body{overflow-y:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px)}
.sheet h2{font-size:19px;font-weight:800;line-height:1.3;margin:6px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;padding:14px}
.kv dt{color:var(--ink-3);font-weight:600} .kv dd{margin:0;font-weight:500}
.status4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status4 button{padding:11px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:center}
.status4 button.on{border-color:currentColor}
.status4 .ns.on{color:var(--ink-2)} .status4 .ip.on{color:var(--blue);background:rgba(46,117,182,.08)}
.status4 .bl.on{color:var(--red);background:var(--red-bg)} .status4 .dn.on{color:var(--green);background:var(--green-bg)}
.sub{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;width:100%;text-align:left}
.sub + .sub{border-top:1px solid var(--line)}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-3);flex-shrink:0;display:grid;place-items:center;margin-top:1px}
.sub.on .cb{background:var(--green);border-color:var(--green)}
.sub.on span{color:var(--ink-3);text-decoration:line-through}
.upd{padding:12px 14px}
.upd + .upd{border-top:1px solid var(--line)}
.upd .w{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.notes{padding:14px;font-size:14px;color:var(--ink-2);white-space:pre-wrap}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:15;background:var(--blue);color:#fff;
  font-weight:700;font-size:15px;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(46,117,182,.4)}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:14px 2px 6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type=date].field{min-width:0;width:100%;padding:12px 10px}
.addrow{display:flex;gap:8px;align-items:center;padding:8px 10px}
.addrow .field{padding:10px 12px;font-size:15px}
.field.plain{border-color:transparent;background:transparent;padding:6px 4px}
.field.plain:focus{border-color:var(--blue);background:var(--card)}
.xbtn{width:34px;height:34px;border-radius:10px;color:var(--ink-3);font-size:15px;flex-shrink:0}
select.field{appearance:auto}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:40;
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;
  transform:translateY(20px);opacity:0;transition:.2s;pointer-events:none;max-width:480px;margin:0 auto}
.toast.on{transform:none;opacity:1}
.loading{display:grid;place-items:center;height:60%;color:var(--ink-3)}
.wide{max-width:720px;margin:0 auto}
.dep{font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="tabs" class="tabs" hidden></div>
  <main id="main"><div class="loading">Loading…</div></main>
  <nav class="bottom" id="nav" hidden>
    <button data-v="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Projects</button>
    <button data-v="week" onclick="go('week')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>My week</button>
    <button data-v="feed" onclick="go('feed')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Activity<span class="dot-badge" id="feedBadge" hidden></span></button>
    <button data-v="me" onclick="go('me')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</button>
  </nav>
</div>
<button class="fab" id="fab" hidden onclick="openForm(S.pid,null)">＋ New task</button>
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="body" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ── CONFIG ─────────────────────────────────────────────────────────
   API_URL = the backend web-app URL (…/exec). Leave '' for demo mode. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwnjygFXXpj_p1tJtIJk6JvH8rG7ueF3mSpsvpodl1aLyFJJD3uUL8L_1Czpaa-88zj/exec';

/* ── state ── */
const S = { pin:'', name:'', view:'home', pid:null, tab:'week', boot:null, proj:null,
            mine:true, q:'', fStatus:'', busy:false, cache:{} };
const store = {
  get(k,d){ try{ const v=localStorage.getItem('pmf_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('pmf_'+k,JSON.stringify(v)); }catch(e){} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').trim().toLowerCase();
const owners = s => String(s||'').split(/\s*(?:\/|,|&|\+|\band\b)\s*/i).map(x=>x.trim()).filter(Boolean);
const isMine = t => owners(t.owner).some(o=>norm(o)===norm(S.name));

/* ── API ── */
async function api(action, params={}, write=false){
  if(!API_URL) return demoApi(action, params);
  const body = Object.assign({action, pin:S.pin, actor:S.name, name:S.name}, params);
  let res;
  if(write){
    res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  } else {
    res = await fetch(API_URL+'?'+new URLSearchParams(body).toString());
  }
  const j = await res.json();
  if(!j.ok){ const e=new Error(j.error||'Error'); e.code=j.error; throw e; }
  return j;
}

/* ── dates ── */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function addD(iso,n){ const p=iso.split('-'); return new Date(Date.UTC(+p[0],p[1]-1,+p[2])+n*864e5).toISOString().slice(0,10); }
function dowOf(iso){ const p=iso.split('-'); return new Date(Date.UTC(+p[0],p[1]-1,+p[2])).getUTCDay(); }
function nice(iso){ if(!iso) return '—'; const p=iso.split('-'); return DOW[dowOf(iso)]+' '+(+p[2])+' '+MON[p[1]-1]; }
function short(iso){ const p=iso.split('-'); return (+p[2])+' '+MON[p[1]-1]; }
function week(){ const t=todayISO(), dw=dowOf(t)||7, from=addD(t,1-dw); return {from,to:addD(from,6)}; }
function ago(ts){
  const t=new Date(ts.replace(' ','T')); const s=(Date.now()-t)/1000;
  if(isNaN(s)) return ts; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago';
  if(s<86400) return Math.floor(s/3600)+' h ago'; if(s<172800) return 'yesterday';
  return short(ts.slice(0,10));
}
function dueChip(t){
  if(t.status==='Done') return `<span class="chip green">✓ ${short(t.finish)}</span>`;
  const today=todayISO();
  if(t.finish<today){ const d=Math.round((Date.parse(today)-Date.parse(t.finish))/864e5);
    return `<span class="chip red">${d}d late · ${short(t.finish)}</span>`; }
  if(t.finish===today) return `<span class="chip amber">Due today</span>`;
  if(t.finish<=week().to) return `<span class="chip amber">Due ${nice(t.finish)}</span>`;
  return `<span class="chip">Due ${short(t.finish)}</span>`;
}
const SCLS={'Not started':'ns','In progress':'ip','Blocked':'bl','Done':'dn'};

/* ── icons ── */
const I = {
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'
};
const AIC={new:['🆕','var(--violet-bg)'],status:['🔄','rgba(46,117,182,.12)'],done:['✅','var(--green-bg)'],
  dates:['📅','var(--amber-bg)'],update:['📝','var(--chip)'],subtask:['☑️','var(--green-bg)'],edit:['✏️','var(--chip)'],deleted:['🗑️','var(--red-bg)']};
const ALBL={new:'New task',status:'Status changed',done:'Completed',dates:'Dates changed',update:'Progress update',
  subtask:'Sub-tasks',edit:'Edited',deleted:'Deleted'};

function ring(pct,size=58,stroke=7){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--chip)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--blue)" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <div class="lbl"><div>${pct}%${size>70?'<small>done</small>':''}</div></div></div>`;
}

/* ── seen / new activity ── */
function seenKey(pid){ return 'seen_'+(pid||'all'); }
function newCount(list,pid){ const s=store.get(seenKey(pid),''); return list.filter(a=>a.ts>s && norm(a.actor)!==norm(S.name)).length; }
function markSeen(list,pid){ if(list && list.length) store.set(seenKey(pid), list[0].ts); }

/* ════════════════ BOOT / ONBOARDING ════════════════ */
function setBoot(b){
  S.boot=b; S.cache=Object.assign({},b.data||{});
  if(S.pid && S.cache[S.pid]) S.proj=S.cache[S.pid];
  store.set('saved',{pin:S.pin,boot:b});
}

async function boot(){
  S.pin=store.get('pin',''); S.name=store.get('name','');
  if(!S.pin){ return renderPin(); }
  const saved=store.get('saved',null);
  if(saved && saved.pin===S.pin && saved.boot && saved.boot.data){
    setBoot(saved.boot);       // show the last known data instantly…
    start();
    return refresh(true);      // …and quietly fetch the latest
  }
  try{
    setBoot(await api('bootstrap'));
  }catch(e){
    if(e.code==='pin'){ store.set('pin',''); S.pin=''; return renderPin('That team code is not right.'); }
    return renderError(e);
  }
  start();
}

function start(){
  if(!S.name || !S.boot.people.some(n=>norm(n)===norm(S.name))) return renderWho();
  $('nav').hidden=false;
  syncPush();
  if(openFromHash()) return;
  if(location.hash==='#feed'){ history.replaceState(null,'',location.pathname); return go('feed'); }
  const v=store.get('view','home');
  if(v==='project' && store.get('pid','')) openProject(store.get('pid',''), store.get('tab','week'));
  else go(v==='project'?'home':v);
}

function shell(title, sub, left='', right=''){
  $('hdr').innerHTML = `${left}<div style="flex:1;min-width:0"><h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>${right}`;
}
const refreshBtn = () => `<button class="hbtn" id="rbtn" onclick="refresh()" aria-label="Refresh">${I.refresh}</button>`;

function renderPin(msg){
  $('nav').hidden=true; $('tabs').hidden=true;
  shell('Tiger Trade','Project Follow-up');
  $('main').innerHTML = `<div class="welcome">
    <img class="logo" src="${ICON_DATA}" alt="">
    <h2>Project Follow-up</h2><p>Enter the Tiger Trade team code to see your projects.</p>
    <input class="field" id="pin" inputmode="numeric" autocomplete="off" placeholder="Team code" style="text-align:center;letter-spacing:.3em;font-size:20px">
    ${msg?`<p style="color:var(--red);margin:10px 0 0">${esc(msg)}</p>`:''}
    <div style="height:14px"></div><button class="btn" onclick="savePin()">Continue</button></div>`;
  $('pin').addEventListener('keydown',e=>{ if(e.key==='Enter') savePin(); });
}
function savePin(){ const v=$('pin').value.trim(); if(!v) return; S.pin=v; store.set('pin',v); boot(); }

function renderWho(){
  $('nav').hidden=true; $('tabs').hidden=true;
  shell('Who are you?','Pick your name once — this phone remembers it');
  const names=S.boot.people.slice().sort((a,b)=>a.localeCompare(b));
  $('main').innerHTML = `<div class="welcome" style="padding-top:4px">
    <p>Your name is used to show <b>your</b> tasks and to tell the team who made a change.</p>
    <div class="names">${names.map(n=>`<button onclick="pickName(this,'${esc(n).replace(/'/g,"\\'")}')">${esc(n)}</button>`).join('')}</div>
    <p class="small">Name missing? Ask the project manager to add you to the People list.</p></div>`;
}
function pickName(el,n){ S.name=n; store.set('name',n); boot(); }

function renderError(e){
  shell('Tiger Trade','Project Follow-up');
  $('main').innerHTML = `<div class="empty"><b>Can't reach the project data</b>${esc(e.message||e)}<div style="height:16px"></div>
    <button class="btn ghost" onclick="boot()">Try again</button></div>`;
}

/* ════════════════ NAV ════════════════ */
function go(v){
  $('fab').hidden=true;
  S.view=v; store.set('view',v); closeSheet();
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('tabs').hidden=true;
  $('main').scrollTop=0;
  ({home:renderHome, week:renderMyWeek, feed:renderFeed, me:renderMe})[v]();
  updateBadge();
}

let _refreshing=false;
async function refresh(quiet){
  if(_refreshing) return; _refreshing=true;
  const spin=on=>{ const b=$('rbtn'); if(b) b.classList.toggle('spin',on); };
  spin(true);
  try{
    setBoot(await api('bootstrap'));
    if(!S.name || !S.boot.people.some(n=>norm(n)===norm(S.name))) return renderWho();
    redraw();
  }catch(e){
    if(e.code==='pin'){ store.set('pin',''); store.set('saved',null); S.pin=''; return renderPin('The team code has changed — please enter the new one.'); }
    if(!quiet) toast(e.message); else toast('Offline — showing saved data');
  }
  finally{ _refreshing=false; spin(false); }
}

/* re-draw whatever is on screen with fresh data, without closing an open form */
function redraw(){
  if(!$('nav') || $('nav').hidden) return;
  const st=$('main').scrollTop;
  if(S.view==='project'){ if(S.cache[S.pid]){ S.proj=S.cache[S.pid]; renderProject(); } }
  else ({home:renderHome, week:renderMyWeek, feed:renderFeed, me:()=>{}})[S.view]();
  $('main').scrollTop=st;
  if(S.sheet && !S.form) renderSheet();
  updateBadge();
}

function updateBadge(){
  if(!S.boot) return;
  const n=newCount(S.boot.activity,null); const b=$('feedBadge');
  b.hidden=!n || S.view==='feed'; b.textContent=n>9?'9+':n;
}

/* ════════════════ HOME ════════════════ */
function renderHome(){
  const hour=new Date().getHours(); const hi=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  shell(`${hi}, ${S.name}`, 'Tiger Trade · '+nice(todayISO()), `<img src="${ICON_DATA}" alt="Tiger Trade" style="width:38px;height:38px;border-radius:10px;flex-shrink:0">`, refreshBtn());
  const ps=S.boot.projects;
  let h = `<div class="wide"><div class="sec">Projects <span class="n">${ps.length}</span></div>`;
  if(!ps.length) h += `<div class="card empty"><b>No projects yet</b>Add one in the Projects tab of the tool's Sheet.</div>`;
  ps.forEach(p=>{
    if(p.error){ h+=`<div class="card pcard"><div><h3>${esc(p.name)}</h3><div class="small" style="color:var(--red)">${esc(p.error)}</div></div></div>`; return; }
    const s=p.stats, nn=newCount(S.boot.activity.filter(a=>a.projectId===p.id),p.id);
    h += `<button class="card pcard" onclick="openProject('${p.id}')">${ring(s.pct)}
      <div style="flex:1;min-width:0"><h3>${esc(p.name)}</h3>
      <div class="small muted">PM ${esc(p.pm)} · ${s.done}/${s.total} tasks done</div>
      <div class="chips">
        ${s.overdue?`<span class="chip red">${s.overdue} overdue</span>`:''}
        ${s.dueWeek?`<span class="chip amber">${s.dueWeek} due this week</span>`:''}
        ${s.blocked?`<span class="chip red">⛔ ${s.blocked} blocked</span>`:''}
        <span class="chip blue">${s.inProgress} in progress</span>
        ${nn?`<span class="chip violet">● ${nn} new</span>`:''}
      </div></div></button>`;
  });
  h += notifNudge();
  const recent=S.boot.activity.slice(0,6);
  if(recent.length){
    h += `<div class="sec">Latest changes</div><div class="card" style="overflow:hidden">${recent.map(a=>actRow(a,null,true)).join('')}</div>
      <div style="height:10px"></div><button class="btn ghost" onclick="go('feed')">See all activity</button>`;
  }
  $('main').innerHTML = h+'</div>';
}

function notifNudge(){
  const st=pushState();
  if(st==='on' || st==='unsupported' || st==='denied' || store.get('nudgeOff',false)) return '';
  return `<div class="card" style="padding:14px;margin-top:4px;display:flex;gap:12px;align-items:center">
    <div style="font-size:26px">🔔</div><div style="flex:1"><b>Turn on notifications</b>
    <div class="small muted">New tasks, updates and your Monday “due this week” list.</div></div>
    <button class="chip blue" style="padding:8px 12px" onclick="go('me')">Set up</button></div>`;
}

/* ════════════════ MY WEEK (all projects) ════════════════ */
async function renderMyWeek(){
  shell('My week', `${short(week().from)} – ${short(week().to)}`, '', refreshBtn());
  $('main').innerHTML='<div class="loading">Loading…</div>';
  try{
    const all=[];
    for(const p of S.boot.projects.filter(p=>!p.error)){
      const d = S.cache[p.id] || (S.cache[p.id]=await api('project',{projectId:p.id}));
      const pm = norm(p.pm)===norm(S.name);
      d.tasks.forEach(t=>{ if(isMine(t) || pm) all.push(Object.assign({_p:p, _pm:pm},t)); });
    }
    if(S.view!=='week') return;
    $('main').innerHTML = '<div class="wide">'+weekLists(all,true)+'</div>';
  }catch(e){ $('main').innerHTML=`<div class="empty"><b>Couldn't load</b>${esc(e.message)}</div>`; }
}

function weekLists(tasks, multi){
  const t0=todayISO(), wk=week(); const open=tasks.filter(t=>t.status!=='Done');
  const late=open.filter(t=>t.finish<t0).sort((a,b)=>a.finish.localeCompare(b.finish));
  const due=open.filter(t=>t.finish>=t0 && t.finish<=wk.to).sort((a,b)=>a.finish.localeCompare(b.finish));
  const starting=open.filter(t=>t.start>=wk.from && t.start<=wk.to && t.finish>wk.to).sort((a,b)=>a.start.localeCompare(b.start));
  const doneWk=tasks.filter(t=>t.status==='Done' && t.finish>=wk.from && t.finish<=wk.to);
  const card = list => `<div class="card group">${list.map(t=>taskRow(t,multi)).join('')}</div>`;
  let h='';
  if(late.length) h+=`<div class="sec red">Overdue <span class="n">${late.length}</span></div>`+card(late);
  h+=`<div class="sec">To deliver this week <span class="n">${due.length}</span></div>`;
  if(due.length){
    const byDay={}; due.forEach(t=>(byDay[t.finish]=byDay[t.finish]||[]).push(t));
    h+=Object.keys(byDay).sort().map(d=>`<div class="card group"><div class="ghead"><span>${d===t0?'Today':nice(d)}</span><span>${byDay[d].length}</span></div>${byDay[d].map(t=>taskRow(t,multi)).join('')}</div>`).join('');
  } else h+=`<div class="card empty"><b>Nothing due this week 🎉</b></div>`;
  if(starting.length) h+=`<div class="sec">Starting this week <span class="n">${starting.length}</span></div>`+card(starting);
  if(doneWk.length) h+=`<div class="sec">Done this week <span class="n">${doneWk.length}</span></div>`+card(doneWk);
  return h;
}

function taskRow(t, showProject){
  const sd=t.subtasks.filter(x=>x.done).length;
  const pid = t._p ? t._p.id : S.pid;
  return `<button class="task ${t.status==='Done'?'done':''}" onclick="openTask('${pid}','${esc(t.id)}')">
    <span class="sdot ${SCLS[t.status]||'ns'}"></span>
    <div style="flex:1;min-width:0"><div class="t">${esc(t.name)}</div>
    <div class="m">${dueChip(t)}<span class="chip">👤 ${esc(t.owner||'—')}</span>
      ${t.status==='Blocked'?'<span class="chip red">⛔ Blocked</span>':''}
      ${t.subtasks.length?`<span class="chip ${sd===t.subtasks.length?'green':''}">☑ ${sd}/${t.subtasks.length}</span>`:''}
      ${t.updates.length?`<span class="chip">📝 ${t.updates.length}</span>`:''}
      ${showProject&&t._p&&S.boot.projects.length>1?`<span class="chip blue">${esc(t._p.name)}</span>`:''}
    </div></div></button>`;
}

/* ════════════════ PROJECT ════════════════ */
async function openProject(pid, tab){
  S.view='project'; S.pid=pid; S.tab=tab||'week'; store.set('view','project'); store.set('pid',pid);
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.v==='home'));
  const meta=S.boot.projects.find(p=>p.id===pid);
  if(!meta){ return go('home'); }
  S.mine = norm(meta.pm)!==norm(S.name);
  shell(meta.name,'Loading…',`<button class="hbtn" onclick="go('home')" aria-label="Back">${I.back}</button>`, refreshBtn());
  if(S.cache[pid]){ S.proj=S.cache[pid]; renderProject(); return; }
  $('main').innerHTML='<div class="loading">Loading…</div>';
  try{ S.proj=await api('project',{projectId:pid}); S.cache[pid]=S.proj; if(S.view==='project'&&S.pid===pid) renderProject(); }
  catch(e){ $('main').innerHTML=`<div class="empty"><b>Couldn't load</b>${esc(e.message)}</div>`; }
}

function setTab(t){ S.tab=t; store.set('tab',t); $('main').scrollTop=0; renderProject(); }

function renderProject(){
  const P=S.proj, p=P.project;
  const ext = p.desktopUrl?`<a class="hbtn" href="${esc(p.desktopUrl)}" target="_blank" rel="noopener" aria-label="Open full plan" style="color:#fff">${I.ext}</a>`:'';
  shell(p.name, `PM ${p.pm} · ${P.stats.pct}% done`, `<button class="hbtn" onclick="go('home')" aria-label="Back">${I.back}</button>`, ext+refreshBtn());
  const nn=newCount(P.activity,p.id);
  const tabs=[['week','This week'],['progress','Progress'],['activity','Activity'+(nn&&S.tab!=='activity'?`<span class="cnt">${nn}</span>`:'')],['tasks','All tasks']];
  $('tabs').hidden=false;
  $('tabs').innerHTML=tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  let h='<div class="wide">';
  if(S.tab==='week'){
    h+=`<div class="seg"><button class="${S.mine?'on':''}" onclick="S.mine=true;renderProject()">My tasks</button><button class="${!S.mine?'on':''}" onclick="S.mine=false;renderProject()">Everyone</button></div>`;
    h+=weekLists(S.mine?P.tasks.filter(isMine):P.tasks,false);
  }
  else if(S.tab==='progress') h+=progressView(P);
  else if(S.tab==='activity'){
    h+= P.activity.length?`<div class="card" style="overflow:hidden">${P.activity.map(a=>actRow(a,p.id)).join('')}</div>`
      :`<div class="card empty"><b>No changes yet</b>Changes show here within ~5 minutes.</div>`;
    setTimeout(()=>{ markSeen(P.activity,p.id); markSeen(S.boot.activity,null); updateBadge(); },1500);
  }
  else h+=allTasksView(P);
  $('main').innerHTML=h+'</div>';
  $('fab').hidden=false;
}

function progressView(P){
  const s=P.stats, t0=todayISO();
  let h=`<div class="card" style="padding:18px;display:flex;gap:18px;align-items:center;margin-bottom:10px">${ring(s.pct,92,10)}
    <div><div class="num" style="font-size:20px">${s.done} of ${s.total}</div><div class="muted small">tasks completed</div>
    <div class="small" style="margin-top:6px">Started ${nice(P.project.start)}</div></div></div>
    <div class="stats">
      <div class="stat"><div class="num" style="color:var(--blue)">${s.inProgress}</div><div class="l">In progress</div></div>
      <div class="stat"><div class="num" style="color:var(--amber)">${s.dueWeek}</div><div class="l">Due this week</div></div>
      <div class="stat"><div class="num" style="color:var(--red)">${s.overdue}</div><div class="l">Overdue</div></div>
    </div>`;
  h+=`<div class="sec">By phase</div><div class="card" style="overflow:hidden">`;
  P.phases.forEach(ph=>{
    const ts=P.tasks.filter(t=>t.phase===ph.id); if(!ts.length) return;
    const d=ts.filter(t=>t.status==='Done').length, ip=ts.filter(t=>t.status==='In progress').length;
    const late=ts.filter(t=>t.status!=='Done'&&t.finish<t0).length, pct=Math.round(d/ts.length*100);
    h+=`<button class="phase" style="width:100%;text-align:left" onclick="S.tab='tasks';S.q='';S.fStatus='';S.fPhase='${ph.id}';renderProject()">
      <div class="top"><span>${esc(ph.name)}</span><span class="muted">${pct}%</span></div>
      <div class="bar"><i style="width:${d/ts.length*100}%;background:var(--green)"></i><i style="width:${ip/ts.length*100}%;background:var(--blue)"></i></div>
      <div class="small muted" style="margin-top:6px">${d}/${ts.length} done${ip?` · ${ip} in progress`:''}${late?` · <span style="color:var(--red)">${late} overdue</span>`:''}</div></button>`;
  });
  h+='</div>';
  // per owner
  const own={}; P.tasks.forEach(t=>owners(t.owner).forEach(o=>{ const k=o; own[k]=own[k]||{n:0,d:0,l:0};
    own[k].n++; if(t.status==='Done') own[k].d++; else if(t.finish<t0) own[k].l++; }));
  h+=`<div class="sec">By owner</div><div class="card" style="overflow:hidden">`+Object.keys(own).sort((a,b)=>own[b].n-own[a].n).map(o=>{
    const x=own[o]; return `<div class="phase"><div class="top"><span>${esc(o)}</span><span class="muted">${x.d}/${x.n}</span></div>
      <div class="bar"><i style="width:${x.d/x.n*100}%;background:var(--green)"></i></div>
      ${x.l?`<div class="small" style="margin-top:6px;color:var(--red)">${x.l} overdue</div>`:''}</div>`; }).join('')+'</div>';
  return h;
}

function allTasksView(P){
  const q=norm(S.q), f=S.fStatus, fp=S.fPhase||'';
  const list=P.tasks.filter(t=>(!f||t.status===f)&&(!fp||t.phase===fp)&&(!q||norm(t.name+' '+t.owner+' '+t.id).includes(q)));
  let h=`<div class="search"><input class="field" placeholder="Search tasks or owners" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{renderProject();const i=document.querySelector('.search input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)"></div>
    <div class="chips-scroll">${['','Not started','In progress','Blocked','Done'].map(s=>`<button class="${f===s?'on':''}" onclick="S.fStatus='${s}';renderProject()">${s||'All'}</button>`).join('')}</div>`;
  if(fp){ const ph=P.phases.find(x=>x.id===fp); h+=`<div style="margin-bottom:10px"><button class="chip blue" onclick="S.fPhase='';renderProject()">${esc(ph?ph.name:fp)} ✕</button></div>`; }
  if(!list.length) return h+`<div class="card empty"><b>No tasks match</b></div>`;
  P.phases.concat([{id:'',name:'Other'}]).forEach(ph=>{
    const ts=list.filter(t=>ph.id?t.phase===ph.id:!P.phases.some(x=>x.id===t.phase)); if(!ts.length) return;
    h+=`<div class="card group"><div class="ghead"><span>${esc(ph.name)}</span><span>${ts.length}</span></div>${ts.map(t=>taskRow(t,false)).join('')}</div>`;
  });
  return h;
}

/* ── activity row ── */
function actRow(a,pid,showProject){
  const [ic,bg]=AIC[a.type]||['•','var(--chip)'];
  const isNew = a.ts>store.get(seenKey(pid),'') && norm(a.actor)!==norm(S.name);
  const can = a.type!=='deleted';
  return `<button class="act ${isNew?'new':''}" ${can?`onclick="openTask('${a.projectId}','${esc(a.taskId)}')"`:''}>
    <div class="aic" style="background:${bg}">${ic}</div>
    <div style="flex:1;min-width:0"><div class="t">${esc(ALBL[a.type]||a.type)} · #${esc(a.taskId)} ${esc(a.task)}</div>
    <div class="d">${esc(a.detail)}</div>
    <div class="w">${ago(a.ts)}${a.actor?' · by '+esc(a.actor):''} · 👤 ${esc(a.owner||'—')}${showProject&&S.boot.projects.length>1?' · '+esc(a.project):''}</div></div></button>`;
}

/* ════════════════ ACTIVITY (all projects) ════════════════ */
function renderFeed(){
  shell('Activity','Changes across all projects','',refreshBtn());
  const A=S.boot.activity;
  $('main').innerHTML = '<div class="wide">'+(A.length?`<div class="card" style="overflow:hidden">${A.map(a=>actRow(a,null,true)).join('')}</div>`
    :`<div class="card empty"><b>No changes yet</b>New tasks and updates will appear here.</div>`)+'</div>';
  setTimeout(()=>{ markSeen(A,null); updateBadge(); },1500);
}

/* ════════════════ TASK SHEET ════════════════ */
async function openTask(pid,id){
  let P=S.cache[pid];
  if(!P){ try{ P=S.cache[pid]=await api('project',{projectId:pid}); }catch(e){ return toast(e.message); } }
  const t=P.tasks.find(x=>String(x.id)===String(id));
  if(!t) return toast('That task no longer exists.');
  S.sheet={pid,id}; S.form=null; renderSheet();
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); S.sheet=null; S.form=null; }

function renderSheet(){
  if(!S.sheet) return;
  const P=S.cache[S.sheet.pid], t=P.tasks.find(x=>String(x.id)===String(S.sheet.id));
  if(!t){ closeSheet(); return; }
  const ph=P.phases.find(p=>p.id===t.phase);
  const ups=t.updates.slice().reverse();
  $('sheetBody').innerHTML = `
    <div class="small muted">#${esc(t.id)} · ${esc(ph?ph.name:'')} · ${esc(P.project.name)}</div>
    <div style="display:flex;gap:10px;align-items:flex-start"><h2 style="flex:1">${esc(t.name)}</h2>
      <button class="chip blue" style="padding:8px 12px;margin-top:6px" onclick="openForm('${S.sheet.pid}','${esc(t.id)}')">✏️ Edit</button></div>
    <div class="card"><dl class="kv">
      <dt>Owner</dt><dd>${esc(t.owner||'—')}</dd>
      <dt>Dates</dt><dd>${nice(t.start)} → <b>${nice(t.finish)}</b></dd>
      <dt>Due</dt><dd>${dueChip(t)}</dd>
      ${t.pri?`<dt>Priority</dt><dd>${esc(t.pri)}</dd>`:''}
      ${t.dep?`<dt>Waits on</dt><dd class="dep">${esc(t.dep)}</dd>`:''}
    </dl></div>
    <div class="sec">Status</div>
    <div class="status4">${['Not started','In progress','Blocked','Done'].map(s=>`<button class="${SCLS[s]} ${t.status===s?'on':''}" onclick="setStatus('${s}')"><span class="sdot ${SCLS[s]}" style="margin:0"></span>${s}</button>`).join('')}</div>
    <div class="sec">Sub-tasks <span class="n">${t.subtasks.filter(x=>x.done).length}/${t.subtasks.length}</span></div>
    <div class="card" style="overflow:hidden">${t.subtasks.map((s,i)=>`<button class="sub ${s.done?'on':''}" onclick="toggleSub(${i})"><span class="cb">${s.done?I.check:''}</span><span>${esc(s.text)}</span></button>`).join('')}

async function write(action, params, optimistic){
  if(S.busy) return; S.busy=true;
  const {pid,id}=S.sheet; const P=S.cache[pid]; const t=P.tasks.find(x=>String(x.id)===String(id));
  const backup=JSON.stringify(t);
  optimistic(t); renderSheet();
  try{
    const res=await api(action,Object.assign({projectId:pid,taskId:id},params),true);
    afterWrite(pid,res); renderSheet();
    toast('Saved ✓');
  }catch(e){
    Object.assign(t,JSON.parse(backup)); renderSheet(); toast('Not saved: '+e.message);
  }finally{ S.busy=false; }
}
function setStatus(s){ write('setStatus',{status:s},t=>t.status=s); }
function toggleSub(i){ write('toggleSub',{index:i,done:!S.cache[S.sheet.pid].tasks.find(x=>String(x.id)===String(S.sheet.id)).subtasks[i].done},t=>t.subtasks[i].done=!t.subtasks[i].done); }
function addSub(){
  const v=$('subText').value.trim(); if(!v) return toast('Write the sub-task first');
  write('addSub',{text:v},t=>t.subtasks.push({text:v,done:false}));
}
function addUpdate(){
  const v=$('updText').value.trim(); if(!v) return toast('Write something first');
  write('addUpdate',{text:v},t=>t.updates.push({ts:todayISO(),text:v,by:S.name}));
}

async function saveForm(){
  if(S.busy) return;

const HOSTED = location.protocol==='https:' && !/googleusercontent|google\.com/.test(location.hostname);
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
const APP_HOME = 'https://tigertrade-hub.github.io/follow-up/';

function pushState(){
  if(!HOSTED) return 'elsewhere';
  if(IOS && !STANDALONE) return 'install';
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return 'unsupported';
  if(Notification.permission==='denied') return 'denied';
  return store.get('pushOn',false) && Notification.permission==='granted' ? 'on' : 'off';
}

function pushBoxHtml(){
  const st=pushState();
  const what=`<div class="small muted" style="margin:4px 0 12px">• a task is added for you<br>• your task is updated or changes status<br>• every Monday: what you need to deliver this week</div>`;
  if(st==='elsewhere') return `<b>Notifications work in the installed app</b><div class="small muted" style="margin:6px 0 12px">Open the Tiger Trade app link on your phone and add it to your home screen.</div>
    <a class="btn" href="${APP_HOME}" target="_blank" rel="noopener">Open the app</a>`;
  if(st==='install') return `<b>First add the app to your Home Screen</b><div class="small muted" style="margin-top:6px">In Safari tap <b>Share</b> → <b>Add to Home Screen</b>. Then open <b>TT Follow-up</b> from the new icon and come back here to turn on notifications.</div>`;
  if(st==='unsupported') return `<b>This phone can't show notifications</b><div class="small muted" style="margin-top:6px">On iPhone you need iOS 16.4 or newer. On Android, use Chrome.</div>`;
  if(st==='denied') return `<b>Notifications are blocked</b><div class="small muted" style="margin-top:6px">${IOS?'Open the phone <b>Settings → Notifications → TT Follow-up</b> and allow notifications.':'In Chrome: ⋮ → <b>Settings → Site settings → Notifications</b> and allow this app.'} Then come back here.</div>`;
  if(st==='on') return `<div style="display:flex;gap:10px;align-items:center"><span style="font-size:24px">✅</span><div><b>Notifications are on</b><div class="small muted">You get alerts for your tasks and a Monday list of what's due.</div></div></div>
    <div style="height:12px"></div><button class="btn ghost" id="pushTest" onclick="testPush()">Send me a test</button>
    <div style="height:8px"></div><button class="btn ghost" style="color:var(--red)" onclick="disablePush()">Turn off on this phone</button>`;
  return `<b>Get notified when:</b>${what}<button class="btn" id="pushOn" onclick="enablePush()">🔔 Turn on notifications</button>`;
}

function deviceId(){
  let d=store.get('deviceId','');
  if(!d){ d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); store.set('deviceId',d); }
  return d;
}
function b64ToU8(b){ b=b.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; return Uint8Array.from(atob(b),c=>c.charCodeAt(0)); }

/* The service worker can't read localStorage, so it gets what it needs through the Cache API. */
async function saveSwConfig(){
  if(!HOSTED || !('caches' in window)) return;
  try{ const c=await caches.open('pmf-config');
    await c.put('config',new Response(JSON.stringify({api:API_URL,pin:S.pin,name:S.name,deviceId:deviceId()}))); }catch(e){}
}

async function subscribeNow(){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(S.boot.vapidKey)});
  await saveSwConfig();
  await api('subscribe',{deviceId:deviceId(),subscription:sub.toJSON(),platform:(IOS?'iPhone ':'')+navigator.userAgent.slice(0,50)},true);
  store.set('pushOn',true); store.set('pushName',S.name);
}

async function enablePush(){
  const b=$('pushOn'); if(b){ b.disabled=true; b.textContent='Turning on…'; }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('Notifications were not allowed'); $('pushBox').innerHTML=pushBoxHtml(); return; }
    await subscribeNow();
    $('pushBox').innerHTML=pushBoxHtml();
    toast('Notifications on ✓ — sending a test…');
    api('testPush').catch(()=>{});
  }catch(e){ toast('Could not turn on: '+e.message); $('pushBox').innerHTML=pushBoxHtml(); }
}

async function disablePush(){
  try{
    const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription();
    if(sub) await sub.unsubscribe();
    await api('unsubscribe',{deviceId:deviceId()},true);
  }catch(e){}
  store.set('pushOn',false); $('pushBox').innerHTML=pushBoxHtml(); toast('Notifications off on this phone');
}

async function testPush(){
  const b=$('pushTest'); b.disabled=true; b.textContent='Sending…';
  try{ const r=await api('testPush'); toast(r.sent?'Sent — it should arrive in a few seconds':'No phone registered — turn notifications off and on again'); }
  catch(e){ toast(e.message); }
  finally{ b.disabled=false; b.textContent='Send me a test'; }
}

/* open a task from a tapped notification: #task=<projectId>/<taskId> */
function openFromHash(){
  const m=location.hash.match(/^#task=([^/]+)\/(.+)$/);
  if(!m) return false;
  history.replaceState(null,'',location.pathname+location.search);
  const pid=decodeURIComponent(m[1]), id=decodeURIComponent(m[2]);
  openProject(pid,'week').then(()=>openTask(pid,id));
  return true;
}

}

  const stats=()=>{const s={total:D.tasks.length,done:0,inProgress:0,blocked:0,overdue:0,dueWeek:0};
    D.tasks.forEach(t=>{ if(t.status==='Done'){s.done++;return;} if(t.status==='In progress')s.inProgress++; if(t.status==='Blocked')s.blocked++;
      if(t.finish<t0)s.overdue++; else if(t.finish<=wk.to)s.dueWeek++; }); s.pct=Math.round(s.done/s.total*100); return s;};
  const proj=()=>({ok:true,project:{id:'showroom',name:'Showroom & Supermarket',pm:'Sofi',desktopUrl:'',start:D.start},phases:D.phases,
    tasks:JSON.parse(JSON.stringify(D.tasks)),stats:stats(),activity:D.activity,today:t0});
  const find=()=>D.tasks.find(t=>t.id===String(p.taskId));
  return new Promise(r=>setTimeout(()=>{
    if(action==='bootstrap') r({ok:true,data:{showroom:proj()},projects:[{id:'showroom',name:'Showroom & Supermarket',pm:'Sofi',stats:stats()}],
      people:['Sofi','Mike','Ameer','Us','External'],vapidKey:'',activity:D.activity});
    else if(action==='project') r(proj());
    else if(action==='setStatus'){ find().status=p.status; r(proj()); }
    else if(action==='toggleSub'){ find().subtasks[p.index].done=p.done; r(proj()); }
    else if(action==='calLink') r({ok:true,url:'https://example.com/cal.ics',webcal:'webcal://example.com/cal.ics'});
    else if(action==='addSub'){ find().subtasks.push({text:p.text,done:false}); r(proj()); }
    else if(action==='saveTask'){ const t=p.task; let x=t.id?find():null;
      if(!x){ x={id:String(Math.max(...D.tasks.map(y=>+y.id))+1),status:'Not started',updates:[]}; D.tasks.push(x); p.taskId=x.id; }
      Object.assign(x,t,{id:x.id}); const o=proj(); o.savedId=x.id; r(o); }
    else if(action==='deleteTask'){ D.tasks=D.tasks.filter(t=>t.id!==String(p.taskId)); r(proj()); }
    else if(action==='addUpdate'){ find().updates.push({ts:t0,text:p.text,by:S.name}); r(proj()); }
    else r({ok:true});
  },250));
}
